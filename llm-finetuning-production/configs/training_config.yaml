# Central Configuration for 7-Day LLM Fine-Tuning & Deployment Pipeline

project:
  name: "llm-finetuning-production"
  task: "structured-json-extraction"
  seed: 42

# Model Selection
model:
  default_model_id: "Qwen/Qwen2.5-1.5B-Instruct"
  fallback_model_id: "Qwen/Qwen2.5-0.5B-Instruct"
  optional_llama_id: "meta-llama/Llama-3.2-1B-Instruct"
  trust_remote_code: false
  use_fast_tokenizer: true

# Dataset Configuration
data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  train_file: "data/processed/train.jsonl"
  val_file: "data/processed/val.jsonl"
  test_file: "data/processed/test.jsonl"
  train_samples: 1200
  val_samples: 150
  test_samples: 150
  max_seq_length: 512

# PEFT / LoRA Hyperparameters
lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

# QLoRA 4-bit Quantization Config
qlora:
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: "float16" # "bfloat16" if Ampere/Ada GPU, "float16" for Colab T4

# SFT Training Arguments
training:
  output_dir: "models/adapters/qwen-1.5b-order-extractor"
  num_train_epochs: 3
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  logging_steps: 10
  eval_strategy: "steps"
  eval_steps: 50
  save_strategy: "steps"
  save_steps: 50
  save_total_limit: 2
  gradient_checkpointing: true
  fp16: true
  bf16: false
  optim: "paged_adamw_8bit"
  report_to: "none" # Set to "wandb" if experiment tracking cloud dashboard is configured

# Evaluation Settings
evaluation:
  test_dataset_path: "data/processed/test.jsonl"
  baseline_metrics_output: "reports/baseline_metrics.json"
  finetuned_metrics_output: "reports/finetuned_metrics.json"
  comparison_report_output: "reports/evaluation_report.md"

# Model Merge & Export
export:
  adapter_dir: "models/adapters/qwen-1.5b-order-extractor"
  merged_dir: "models/merged/qwen-1.5b-order-extractor"
  quantized_dir: "models/quantized/qwen-1.5b-order-extractor-4bit"

# API & Deployment Settings
api:
  host: "0.0.0.0"
  port: 8000
  model_dir: "models/merged/qwen-1.5b-order-extractor"
  timeout_seconds: 30
